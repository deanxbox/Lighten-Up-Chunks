name: release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: verify tag matches mod_version+minecraft_version
        run: |
          expected="v$(sed -n 's/^mod_version=//p' gradle.properties)+$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          [ "$GITHUB_REF_NAME" = "$expected" ] || { echo "Tag $GITHUB_REF_NAME != $expected"; exit 1; }
      - run: ./gradlew build modrinth
        env:
          MODRINTH_KEY: ${{ secrets.MODRINTH_KEY }}
